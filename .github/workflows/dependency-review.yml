name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        continue-on-error: true  # remove once dependency graph is indexed for this repo
        uses: actions/dependency-review-action@v5
        with:
          # Block PRs that introduce vulnerabilities at these severities or higher
          fail-on-severity: moderate

          # Only allow dependencies with these SPDX licenses (permissive / weak copyleft).
          # Allowlist replaces the deprecated deny-licenses option:
          # https://github.com/actions/dependency-review-action/issues/997
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD, Unlicense, CC0-1.0, Python-2.0

          # Per-package exceptions for reviewed dependencies (purl format), e.g.:
          # allow-dependencies-licenses: pkg:pypi/some-package

          # Post a summary comment on the PR
          comment-summary-in-pr: always

          # Fail if any dependency has no license information
          # deny-unlicensed: true  # Uncomment to enforce license presence
